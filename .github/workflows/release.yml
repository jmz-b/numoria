name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [ncurses, sdl2, gl]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/dungeons-of-moria/umoria.git
          git fetch upstream

      - name: Install dependencies
        run: sudo apt-get install -y libncurses-dev libsdl2-dev libsdl2-ttf-dev libgl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNUMORIA_CURSES=${{ matrix.backend }}

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: cmake --build build --target package

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.tar.gz
          fail_on_unmatched_files: true

  build-windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/dungeons-of-moria/umoria.git
          git fetch upstream

      - name: Install dependencies
        run: sudo apt-get install -y mingw-w64

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNUMORIA_CURSES=wingui \
            -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchains/mingw-w64-x86_64.cmake

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: cmake --build build --target package

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          fail_on_unmatched_files: true
